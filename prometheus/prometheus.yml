global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: cadvisor
    static_configs: [{targets: ["cadvisor:8080"]}]
  - job_name: node-exporter
    static_configs: [{targets: ["node-exporter:9100"]}]
  - job_name: demo-app
    static_configs: [{targets: ["demo-app:5000"]}]
  - job_name: healer
    static_configs: [{targets: ["healer:8000"]}]
