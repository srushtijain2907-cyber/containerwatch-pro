groups:
  - name: containerwatch
    rules:
      - alert: HighContainerCPU
        expr: cw_container_cpu_percent > 80
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "High CPU on {{ $labels.name }}"
          description: "CPU is {{ $value | printf \"%.0f\" }}% of one core (threshold 80%)."

      - alert: HighContainerMemory
        expr: cw_container_memory_percent > 85
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "High memory on {{ $labels.name }}"
          description: "Memory is {{ $value | printf \"%.0f\" }}% of its limit (threshold 85%)."

      - alert: ContainerSelfHealed
        expr: increase(healer_restarts_total[2m]) > 0
        labels: {severity: info}
        annotations:
          summary: "{{ $labels.container }} was self-healed ({{ $labels.reason }})"
          description: "The healer restarted {{ $labels.container }}."

      - alert: ContainerRestartLoop
        expr: increase(healer_restarts_total[10m]) > 3
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.container }} keeps failing"
          description: "More than 3 self-heals in 10 minutes. Needs a human."

      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "{{ $labels.instance }} unreachable for over 1 minute."

      - alert: HostHighCPU
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 85
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Host CPU above 85%"
          description: "Host CPU is {{ $value | printf \"%.0f\" }}%."
