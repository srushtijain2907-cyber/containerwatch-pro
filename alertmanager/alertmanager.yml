route:
  receiver: notify
  group_by: [alertname, container]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: notify
    webhook_configs:                       # ACTIVE: alerts appear on the status page
      - url: http://healer:8000/webhook
        send_resolved: true

    # OPTIONAL 1: Discord (Server Settings > Integrations > Webhooks > copy URL)
