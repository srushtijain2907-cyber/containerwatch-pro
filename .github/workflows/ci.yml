name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r demo-app/requirements.txt -r healer/requirements.txt pytest
      - run: pytest -q

  config-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose
        run: GRAFANA_ADMIN_PASSWORD=x docker compose config -q
      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/prometheus:/p" prom/prometheus:v2.54.1 check config /p/prometheus.yml || true
          docker run --rm --entrypoint promtool -v "$PWD/prometheus:/p" prom/prometheus:v2.54.1 check rules /p/alert_rules.yml
      - name: Validate Alertmanager config
        run: docker run --rm --entrypoint amtool -v "$PWD/alertmanager:/a" prom/alertmanager:v0.27.0 check-config /a/alertmanager.yml

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t cw-demo:ci demo-app
          docker build -t cw-healer:ci healer
      - name: Scan images with Trivy
        run: |
          for img in cw-demo:ci cw-healer:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image --severity CRITICAL --exit-code 1 --ignore-unfixed "$img"
          done